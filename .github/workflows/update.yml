# Holt jede Nacht frische Daten von TMDB und MDBList, speichert sie in
# data/data.json und veröffentlicht die Website über GitHub Pages.
# Läuft außerdem nach jeder Änderung im Repository – auch wenn die Website
# eine eigene Serie in data/eigene.json einträgt. Dann sind deren Daten nach
# ein bis zwei Minuten da.
# Voraussetzung: Settings → Pages → Source = „GitHub Actions“ und die
# Secrets TMDB_TOKEN und MDBLIST_API_KEY (siehe README).
name: Daten aktualisieren

on:
  schedule:
    # Täglich um 02:17 UTC = 03:17 Uhr (Winterzeit) bzw. 04:17 Uhr (Sommerzeit).
    # Bewusst nicht zur vollen Stunde – dann sind die GitHub-Server am vollsten.
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      alles_neu:
        description: 'Wertungen sofort neu laden (sonst höchstens alle 20 Stunden)'
        type: boolean
        default: false
  # Jede Änderung auf main: series.json, eigene.json (z. B. von der Website), Code
  push:
    branches: [main]

permissions:
  contents: write  # data.json zurück ins Repository schreiben
  pages: write     # Website veröffentlichen
  id-token: write  # wird von GitHub Pages zur Prüfung benötigt
  actions: write   # Zeitplan aktiv halten (siehe Schritt „Zeitplan aktiv halten“)

# Läufe warten aufeinander, statt gleichzeitig zu arbeiten.
concurrency:
  group: serien-update
  cancel-in-progress: false

jobs:
  aktualisieren:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.veroeffentlichen.outputs.page_url }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7
        with:
          # Immer den neuesten Stand holen – auch wenn dieser Lauf warten musste,
          # bis ein anderer fertig war, und dieser inzwischen Daten gespeichert hat.
          ref: ${{ github.ref_name }}

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Daten von TMDB und MDBList holen
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
          FORCE_REFRESH: ${{ inputs.alles_neu }}
        run: node scripts/update.mjs

      - name: Neue Daten committen
        id: speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          zweig="$GITHUB_REF_NAME"
          for versuch in 1 2 3 4 5; do
            # Den neuesten Stand holen und nur die frisch erzeugten Dateien daraufsetzen.
            # So gibt es keine Konflikte, auch wenn inzwischen ein anderer Lauf
            # oder du selbst etwas gespeichert hast.
            if git fetch --quiet --depth=1 origin "$zweig" && git reset --quiet --mixed FETCH_HEAD; then
              git add data/data.json
              # Das TMDB-Logo nur hinzufügen, wenn es im Repository noch fehlt
              if [ -f img/tmdb-logo.svg ] && ! git cat-file -e HEAD:img/tmdb-logo.svg 2>/dev/null; then
                git add img/tmdb-logo.svg
              fi
              if git diff --cached --quiet; then
                echo "Keine Änderungen zu speichern."
                exit 0
              fi
              git commit --quiet -m "Daten aktualisiert ($(date -u +%Y-%m-%d))"
              if git push --quiet origin "HEAD:$zweig"; then
                echo "Neue Daten gespeichert."
                exit 0
              fi
            fi
            if [ "$versuch" -lt 5 ]; then
              echo "Speichern hat nicht geklappt (Versuch $versuch von 5) – neuer Versuch in $((versuch * 5)) Sekunden …"
              sleep $((versuch * 5))
            fi
          done
          echo "Speichern ist auch nach 5 Versuchen fehlgeschlagen."
          # Die Website wird trotzdem veröffentlicht; der Lauf wird am Ende rot markiert.
          echo "fehlgeschlagen=true" >> "$GITHUB_OUTPUT"

      - name: Zeitplan aktiv halten
        # GitHub schaltet geplante Workflows in öffentlichen Repositories nach
        # 60 Tagen ohne Aktivität ab. Das erneute Aktivieren per API beugt dem vor.
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable"

      - name: Website-Dateien zusammenstellen
        run: |
          mkdir -p _site/data
          cp index.html style.css app.js _site/
          cp data/data.json _site/data/
          if [ -d fonts ]; then cp -r fonts _site/; fi
          if [ -d img ]; then cp -r img _site/; fi

      - name: GitHub Pages vorbereiten
        uses: actions/configure-pages@v6

      - name: Website hochladen
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Website veröffentlichen
        id: veroeffentlichen
        uses: actions/deploy-pages@v5

      - name: Ergebnis prüfen
        if: ${{ steps.speichern.outputs.fehlgeschlagen == 'true' }}
        run: |
          echo "::error title=Daten nicht gespeichert::Die Website zeigt die neuen Daten, aber data/data.json konnte nicht im Repository gespeichert werden. Starte den Workflow später erneut (Actions → Daten aktualisieren → Run workflow)."
          exit 1
